version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: nearhelp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: nearhelp
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nearhelp-network

  # Node.js Application
  app:
    build: .
    container_name: nearhelp-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://admin:password123@mongodb:27017/nearhelp?authSource=admin
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - nearhelp-network
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs

volumes:
  mongodb_data:
    driver: local

networks:
  nearhelp-network:
    driver: bridge
