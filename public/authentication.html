<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NearHelp — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }

        h2 { text-align: center; margin-bottom: 24px; font-size: 1.6rem; }
        h2 span { color: #ff3b3b; }

        .tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }

        .tabs button {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: 0.2s;
        }

        .tabs button.active { border-color: #ff3b3b; color: #ff3b3b; font-weight: 600; }

        form { display: none; flex-direction: column; gap: 12px; }
        form.active { display: flex; }

        input, select {
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(255,255,255,0.07);
            color: white;
            outline: none;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            transition: border 0.2s;
        }
        input:focus, select:focus { border-color: rgba(255,59,59,0.5); }
        select option { background: #1e293b; }

        button.submit-btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff3b3b, #cc0000);
            color: white;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            transition: 0.2s;
            margin-top: 4px;
        }
        button.submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        button.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .error-msg {
            background: rgba(255,59,59,0.15);
            border: 1px solid rgba(255,59,59,0.4);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #ffb2b2;
            display: none;
        }
        .error-msg.show { display: block; }

        .success-msg {
            background: rgba(76,215,246,0.15);
            border: 1px solid rgba(76,215,246,0.4);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #a0f0ff;
            display: none;
        }
        .success-msg.show { display: block; }

        .small-text { font-size: 12px; opacity: 0.5; text-align: center; margin-top: 12px; }
        .gps-status { font-size: 11px; color: #4cd7f6; margin-top: 2px; }
    </style>
</head>

<body>
    <div class="container">
        <h2>Near<span>Help</span></h2>

        <div class="tabs">
            <button id="signinTab" class="active" onclick="switchTab('signin')">Sign In</button>
            <button id="signupTab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- SIGN IN -->
        <form id="signinForm" class="active">
            <div class="error-msg" id="login-error"></div>
            <input type="email" id="loginEmail" placeholder="Email Address" required autocomplete="email">
            <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
            <button type="submit" class="submit-btn" id="loginBtn">Sign In</button>
        </form>

        <!-- SIGN UP -->
        <form id="signupForm">
            <div class="error-msg" id="signup-error"></div>
            <div class="success-msg" id="signup-success"></div>
            <input type="text" id="signupName" placeholder="Full Name" required>
            <input type="email" id="signupEmail" placeholder="Email Address" required autocomplete="email">
            <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required autocomplete="new-password">
            <input type="tel" id="signupPhone" placeholder="Phone Number (10 digits)" required>

            <select id="signupRole" required>
                <option value="">Select Your Role</option>
                <option value="citizen">Citizen / General Public</option>
                <option value="medical">Doctor / Medical Professional</option>
                <option value="police">Police / Security</option>
                <option value="fire">Firefighter / Rescue</option>
                <option value="mechanic">Car Mechanic / Technician</option>
                <option value="volunteer">Volunteer / Neighbour</option>
                <option value="other">Other</option>
            </select>

            <div>
                <input type="text" id="signupLocation" placeholder="Detecting your location..." readonly>
                <div class="gps-status" id="gps-status">📍 Requesting GPS...</div>
            </div>

            <button type="submit" class="submit-btn" id="signupBtn">Create Account</button>
        </form>

        <div class="small-text">Your location is used for emergency matching only.</div>
    </div>

    <script>
        // ── TAB SWITCHER ──────────────────────────────────────────
        function switchTab(tab) {
            var signin = document.getElementById('signinTab');
            var signup = document.getElementById('signupTab');
            var signinForm = document.getElementById('signinForm');
            var signupForm = document.getElementById('signupForm');
            if (tab === 'signin') {
                signin.classList.add('active');
                signup.classList.remove('active');
                signinForm.classList.add('active');
                signupForm.classList.remove('active');
            } else {
                signup.classList.add('active');
                signin.classList.remove('active');
                signupForm.classList.add('active');
                signinForm.classList.remove('active');
            }
        }

        // ── ERROR/SUCCESS DISPLAY ──────────────────────────────────
        function showError(id, msg) {
            var el = document.getElementById(id);
            el.textContent = msg;
            el.classList.add('show');
        }
        function hideError(id) {
            var el = document.getElementById(id);
            el.classList.remove('show');
        }
        function showSuccess(id, msg) {
            var el = document.getElementById(id);
            el.textContent = msg;
            el.classList.add('show');
        }

        // ── GPS DETECTION ──────────────────────────────────────────
        var userLat = null, userLng = null;
        var gpsStatus = document.getElementById('gps-status');

        function setLocation(lat, lng, source) {
            userLat = lat; userLng = lng;
            document.getElementById('signupLocation').value = lat + ',' + lng;
            gpsStatus.textContent = source === 'gps'
                ? '✅ GPS location detected'
                : '⚠️ Approximate location (IP-based). Enable GPS for accuracy.';
        }

        function tryIPFallback() {
            gpsStatus.textContent = '🌐 Trying IP-based location...';
            fetch('https://ipapi.co/json/')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data && data.latitude) {
                        setLocation(data.latitude, data.longitude, 'ip');
                    } else {
                        // Last resort — Kolkata coordinates
                        setLocation(22.5726, 88.3639, 'default');
                        gpsStatus.textContent = '⚠️ Could not detect location. Using default.';
                    }
                })
                .catch(function() {
                    setLocation(22.5726, 88.3639, 'default');
                    gpsStatus.textContent = '⚠️ Location detection failed. Using default.';
                });
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) { setLocation(pos.coords.latitude, pos.coords.longitude, 'gps'); },
                function() { tryIPFallback(); },
                { timeout: 8000, enableHighAccuracy: true }
            );
        } else {
            tryIPFallback();
        }

        // ── SIGNUP ────────────────────────────────────────────────
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideError('signup-error');

            var name = document.getElementById('signupName').value.trim();
            var email = document.getElementById('signupEmail').value.trim();
            var password = document.getElementById('signupPassword').value;
            var phone = document.getElementById('signupPhone').value.trim();
            var role = document.getElementById('signupRole').value;
            var location = document.getElementById('signupLocation').value || '22.5726,88.3639';

            if (!name || !email || !password || !phone || !role) {
                showError('signup-error', 'Please fill in all fields.');
                return;
            }
            if (password.length < 6) {
                showError('signup-error', 'Password must be at least 6 characters.');
                return;
            }
            if (!/^\d{10,15}$/.test(phone)) {
                showError('signup-error', 'Phone number must be 10–15 digits.');
                return;
            }

            var btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                var res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, phone, role, location })
                });
                var data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify({
                        email: data.user.email,
                        uid: data.user._id,
                        name: data.user.name,
                        phone: phone,
                        role: data.user.role
                    }));
                    showSuccess('signup-success', '✅ Account created! Redirecting...');
                    setTimeout(function() { window.location.href = 'index.html'; }, 1000);
                } else {
                    showError('signup-error', data.msg || data.error || 'Signup failed. Please try again.');
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                }
            } catch (err) {
                showError('signup-error', 'Network error: ' + err.message + '. Make sure you are connected.');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });

        // ── LOGIN ─────────────────────────────────────────────────
        document.getElementById('signinForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideError('login-error');

            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('login-error', 'Please enter your email and password.');
                return;
            }

            var btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                var res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                var data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify({
                        email: data.user.email,
                        uid: data.user._id,
                        name: data.user.name,
                        role: data.user.role
                    }));
                    window.location.href = 'index.html';
                } else {
                    showError('login-error', data.msg || data.error || 'Invalid email or password.');
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            } catch (err) {
                showError('login-error', 'Network error: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // Redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
